// This file (definition file) specifies the writing method of the file to be
// written to the CNC. For example, specify in which folder on the CNC the 
// program should be written.
//
// The Definition file consists of "Section", "Key", and "Value" as follows. 
// [Section]
// Key=Value
//
// The "Value" is not required for the "Section" that does not write to the CNC.
// You can delete unnecessary "Section".
// In that case, be sure to delete "Section", "Key", and "Value" together.
//
// This file describes usage examples.
// The files written by the definition of this file are as follows.
// - Application file
//   The following files in the folder <c:\Machine1\>
//   1.The extension is ".mem" or .000(Excluding PMC1.000 and PMCS.000)
//   2.File name is M1PMCMSG
// - Program file
//   The following files in the folder <c:\Machine1\>
//   1.File name is ALL-PROG.TXT
//     (The CNC folder to write://CNC_MEM/USER/PATH1/)
//   2.File name is ALL-PROG.P-2
//     (The CNC folder to write://CNC_MEM/USER/PATH2/)
// - Tool offset data
//   The following files in the folder <c:\Machine1\>
//   1.File name is TOOLOFST.TXT(The path to write:1)
//   2.File name is TOOLOFST.P-2(The path to write:2)
// - Parameter
//   The following files in the folder <c:\Machine2\>
//   1.File name is CNC-PARA.TXT
//

// Storage folder
// When selecting "Storage folder" on the startup screen, you do not need to
// specify. If set, the "Storage folder" on the startup screen is ignored.
[InputFolder]
Folder=c:\Machine1

// Application file
// Wildcards can be used in each file name.
// The following is an example of writing all files with the extension
// "mem" or "000".It is not necessary to define the numbers consecutively.
// The following definitions are possible.
[ApplicationFile]
File1=*.mem
File2=*.000
File10=M1PMCMSG

// Not write file
// Specifies the files that are included in the wildcard but do not want to
// write.
[NotWriteFile]
File1=PMC1.000
File2=
File3=PMCS.000
File4=

// Program file
// Specify the folder to write the program file after "Folder=".
[Program1]
Folder=//CNC_MEM/USER/PATH1/
File=ALL-PROG.TXT

[Program2]
Folder=//CNC_MEM/USER/PATH2/
File=ALL-PROG.P-2

// Tool offset data
// Specify the path to write the tool file after "Path =".
[ToolOffsetData1]
Path=1
File=TOOLOFST.TXT

[ToolOffsetData2]
Path=2
File=TOOLOFST.P-2

// Parameter
// When writing a file stored in a folder different from "Storage folder",
// the file path can be written.
[Parameter1]
File=c:\Machine2\CNC-PARA.TXT

// About the file not to write, please do not set "Value" or please delete the
