//本ファイル（定義ファイル）は、CNCへ書込むファイルをどのように書込むか指定する
//ファイルです。
//例えば、プログラムをCNCのどこのフォルダに書込むかなどを指定します。
//
//定義ファイルは、次のように“セクション”と“キー”と“値”で構成されています。
//[セクション]
//キー=値
//
//書込まないセクションの“値”は記載不要です。
//不要なセクションは項目ごと削除しても構いません。
//その際は必ず“セクション”と“キー”と“値”を一緒に削除してください。
//
//本ファイルでは使用例を記載します。
//本ファイルの定義で書込まれるファイルは以下となります。
//■アプリケーションファイル 
//  フォルダ <c:\Machine1\> の以下のファイル
//  1.拡張子が .mem または .000(PMC1.000, PMCS.000を除く)
//  2.ファイル名 M1PMCMSG
//■プログラムファイル
//  フォルダ <c:\Machine1\> の以下のファイル
//  1.ファイル名 ALL-PROG.TXT
//    (書込まれるCNCのフォルダ://CNC_MEM/USER/PATH1/)
//  2.ファイル名 ALL-PROG.P-2
//    (書込まれるCNCのフォルダ://CNC_MEM/USER/PATH2/)
//■工具オフセットデータ
//  フォルダ <c:\Machine1\> の以下のファイル
//  1.ファイル名 TOOLOFST.TXT(書込まれるCNCの系統:1)
//  2.ファイル名 TOOLOFST.P-2(書込まれるCNCの系統:2)
//■パラメータ
//  フォルダ <c:\Machine2\> の以下のファイル
//  1.ファイル名 CNC-PARA.TXT
//

//格納フォルダ
//起動画面で格納フォルダを選択する場合指定は不要です。
//設定した場合、起動画面の格納フォルダは無視されます。
[InputFolder]
Folder=c:\Machine1

//アプリケーションファイル
//各ファイル名にはワイルドカードが使用できます。
//以下は拡張子 mem, 000 のファイルをすべて書込み対象とする例です。
//追番を連続して定義する必要はありません。以下のような定義が可能です。
[ApplicationFile]
File1=*.mem
File2=*.000
File10=M1PMCMSG

//書込まないファイル
//ワイルドカードで指定したファイル等で対象外とするファイルを記載します。
[NotWriteFile]
File1=PMC1.000
File2=
File3=PMCS.000
File4=

//プログラムファイル
//"Folder="の後にプログラムファイルを書込むフォルダを指定します。
[Program1]
Folder=//CNC_MEM/USER/PATH1/
File=ALL-PROG.TXT

[Program2]
Folder=//CNC_MEM/USER/PATH2/
File=ALL-PROG.P-2

//工具オフセットデータ
//"Path="の後に工具ファイルを書込む系統を指定します。
[ToolOffsetData1]
Path=1
File=TOOLOFST.TXT

[ToolOffsetData2]
Path=2
File=TOOLOFST.P-2

//パラメータ
//格納フォルダと異なるフォルダに格納されたファイルを書込む場合は
//ファイルパスを記載することができます。
[Parameter1]
File=c:\Machine2\CNC-PARA.TXT

// 書込まないファイルは、"値"を設定しない、または、項目を削除してください。

